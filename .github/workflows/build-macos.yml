name: Build macOS App

# 触发条件：
#   - 推 main
#   - 打 v* tag（打 tag 时额外产出带版本号的产物）
#   - 手动触发（workflow_dispatch），方便"只想验证能不能编过"
# 不在 PR 上构建：macOS runner 一分钟起步，PR 上每次提交都跑一遍太贵；
# 真需要验证 PR 的话，手动触发一次即可。
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  # 同一个分支的并发提交只留最新一次构建，早先的直接取消，
  # 省下 macOS runner 的排队时间（macOS runner 比 Linux 贵得多）
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 必须用 macOS runner —— Swift 工具链只在 macOS/Linux 上有，
    # Windows runner 装不了，所以"在 Windows 上开发、云端编译"这条路必须靠 macOS runner。
    runs-on: macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读出 Swift 版本
        run: swift --version

      # ---- 缓存 .build ----
      # 这一步是整个流水线里最值钱的几行。
      # Swift 的增量编译缓存放在 .build/ 里，冷启动一次全量编译要好几分钟；
      # 不缓存的话每次提交都要重新等，而且 macOS runner 排队本身就慢，
      # 叠加起来体验非常差（本地等几分钟 + CI 等十几分钟）。
      # 缓存 key 里带上 Package.swift 的哈希：依赖变了就自动失效，
      # 避免用旧依赖的产物编译出错误的结果。
      - name: 缓存 Swift 构建目录
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: 编译（release）
        run: swift build -c release --disable-sandbox
        env:
          # 告诉 SwiftPM 关掉自己那层沙箱：runner 上的临时目录权限行为
          # 在 CI 里偶尔会让 sandbox 报错，--disable-sandbox 是 CI 环境的常规做法。
          SWIFTPM_DISABLE_SANDBOX: "1"

      # ---- 组 .app bundle ----
      # SwiftPM 只产出一个裸可执行文件，没有 Info.plist、没有图标，
      # 直接双击是不能当应用打开的（macOS 认的是 bundle 结构）。
      # 所以这里手工组装：把二进制塞进 Contents/MacOS/，写一份 Info.plist。
      # 用「bundle id + 版本号」而不是硬编码，保证多分支构建的产物彼此独立，
      # 装多个版本时会共存而不是互相覆盖。
      - name: 组装 .app bundle
        run: |
          set -euo pipefail

          APP_NAME="SanhaiMac"
          BUNDLE_ID="com.sanhai.mac.client"
          BUILD_DIR="$PWD/.build-app"
          APP="$BUILD_DIR/$APP_NAME.app"

          # ---- 版本号 ----
          # ⚠️ 这是个真坑：CFBundleVersion 必须是「点分数字」（如 0.1.0），
          #    写成分支名 "main" 的话，plist 依然能通过 plutil -lint（语法合法），
          #    但 macOS 读它做构建号时会判为非法 —— 而报错发生在**别人机器上**，
          #    表现成"装不上/打不开"，极难定位。所以这里自己先算好并校验。
          #
          # 规则：
          #   有形如 v0.1.0 的 tag → 用tag 的数字部分
          #   否则→ 0.0.<CI 运行号>（运行号是单调递增的，能区分每次构建）
          REF_NAME="${GITHUB_REF_NAME:-}"
          if [[ "$REF_NAME" =~ ^v?([0-9]+(\.[0-9]+)*)$ ]]; then
            RAW="${BASH_REMATCH[1]}"
          else
            RAW="0.0.${GITHUB_RUN_NUMBER:-0}"
          fi

          # 补齐成三段。CFBundleShortVersionString 惯例是「数字.数字.数字」，
          # 只写 0.1 有些工具链会解析失败。
          IFS='.' read -r MAJ MIN PAT <<< "$RAW"
          SHORT_VERSION="${MAJ:-0}.${MIN:-0}.${PAT:-0}"

          # 校验：只允许点分数字，且最多三段。不合规就直接让构建失败，
          # 绝不把一个坏版本号发出去 —— 宁可 CI 红，也不能让人拿到装不上的包。
          if ! [[ "$SHORT_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "版本号不合规: '$SHORT_VERSION'（来自 ref='$REF_NAME'）" >&2
            exit 1
          fi

          # 构建号与版本号保持一致。同一份源码的构建号必须一致，
          # 否则 macOS 会把同一个 app 认成不同版本，反复要求重装。
          BUILD_VERSION="$SHORT_VERSION"
          echo "版本号: short=$SHORT_VERSION build=$BUILD_VERSION (ref='$REF_NAME')"

          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          cp ".build/release/$APP_NAME" "$APP/Contents/MacOS/$APP_NAME"
          chmod +x "$APP/Contents/MacOS/$APP_NAME"

          # Info.plist：
          #  CFBundleExecutable —— 必须和 MacOS/ 里的文件名一致
          #  LSMinimumSystemVersion —— 低于这个版本的 macOS 不给装（工程里定的是 13）
          #  LSUIElement 不设 —— 客户端要出现在 Dock 和程序坞里
          #  NSHighResolutionCapable —— 必须为 true，否则界面在 Retina 上是模糊的
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>                  <string>$APP_NAME</string>
              <key>CFBundleDisplayName</key>           <string>SanhaiOJ 客户端</string>
              <key>CFBundleExecutable</key>            <string>$APP_NAME</string>
              <key>CFBundleIdentifier</key>            <string>$BUNDLE_ID</string>
              <key>CFBundleVersion</key>               <string>$BUILD_VERSION</string>
              <key>CFBundleShortVersionString</key>    <string>$SHORT_VERSION</string>
              <key>CFBundlePackageType</key>           <string>APPL</string>
              <key>CFBundleInfoDictionaryVersion</key> <string>6.0</string>
              <key>LSMinimumSystemVersion</key>        <string>13.0</string>
              <key>NSHighResolutionCapable</key>       <true/>
              <key>NSHumanReadableCopyright</key>      <string>SanhaiOJ</string>
              <key>CFBundleDevelopmentRegion</key>     <string>zh_CN</string>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <!-- 只允许 HTTPS。站点是 https 的，
                       显式关掉「允许任意 HTTP」比依赖默认值更清楚。 -->
                  <key>NSAllowsArbitraryLoads</key><false/>
              </dict>
          </dict>
          </plist>
          PLIST

          # 校验 bundle 结构：这一步很便宜，但能在打包阶段就发现
          # 「二进制没复制进去」「plist 写坏了」这类问题，
          # 比等到 artifact 下载下来双击打不开再回头查快得多。
          echo "校验 bundle…"
          test -x "$APP/Contents/MacOS/$APP_NAME"
          plutil -lint "$APP/Contents/Info.plist"

          # ⚠️ 这里**不要**写 `echo "$APP" >> "$GITHUB_OUTPUT"`。
          #    那个步骤没有声明 `id:`，往 GITHUB_OUTPUT 写值会直接让整个 step 失败：
          #      Unable to process file command 'output' successfully.
          #      Invalid format '/Users/.../SanhaiMac.app'
          #    报错信息完全看不出是 GITHUB_OUTPUT 的问题，很容易误以为是 plist 坏了。
          #    而且这个路径根本没人消费 —— 后面的 zip / dmg 步骤都是直接用
          #    `.build-app/SanhaiMac.app` 这个相对路径，不需要传递。
          #    确实需要传值时才加 `id: bundle`，并写成 `steps.bundle.outputs.path`。
          echo "bundle 就绪：$APP"

      - name: 压 zip
        # zip 给"手动安装"用：解压后把 .app 拖进「应用程序」就能用。
        # macOS 解压 zip 会自动去掉隔离属性（quarantine），
        # 所以从 zip 装的未签名 app 比直接下 dmg 顺畅一些。
        run: |
          set -euo pipefail
          cd .build-app
          # -x 去掉 macOS 特有的 __MACOSX 垃圾目录
          ditto -c -k --keepParent "SanhaiMac.app" "SanhaiMac-macos.zip"

      - name: 做 dmg
        # dmg 是个带背景图和图标拖拽区的磁盘镜像，双击会挂载。
        # 只用系统自带的 hdiutil，不装任何第三方打包工具 —— 一个 dmg 不值得引入依赖。
        run: |
          set -euo pipefail
          STAGE="$PWD/.build-dmg"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R ".build-app/SanhaiMac.app" "$STAGE/"
          # 做成和 /Applications 之间有软链接的布局：用户一拖就是"安装"
          ln -s /Applications "$STAGE/Applications"

          hdiutil create \
            -volname "SanhaiMac" \
            -srcfolder "$STAGE" \
            -ov -format UDZO \
            "SanhaiMac.dmg"

          hdiutil verify "SanhaiMac.dmg"

      # ------------------------------------------------------------------
      # 将来有 Apple 开发者账号时，在这里插入两步签名 + 公证：
      #
      #   1) 签名（本地/临时身份也行，公证才必须用 Developer ID）：
      #      codesign --force --deep --options runtime \
      #               --sign "Developer ID Application: XXX (TEAMID)" \
      #               --timestamp "http://timestamp.apple.com/tsapple" \
      #               "SanhaiMac.app"
      #
      #   2) 公证（需要 Apple ID App 专用密码作为 keychain profile）：
      #      xcrun notarytool submit "SanhaiMac.dmg" \
      #             --keychain-profile "AC_PASSWORD" \
      #             --wait
      #      xcrun stapler staple "SanhaiMac.dmg"
      #
      # 账号存在 GitHub Secrets 里：AC_KEYCHAIN_PROFILE / AC_APPLE_ID / AC_TEAM_ID 等。
      # 现在用户没有开发者账号，所以这两步整个省略 —— 未签名产物双击会被 Gatekeeper 拦，
      # 绕过方法写在 README 里。
      # ------------------------------------------------------------------

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: SanhaiMac-macos
          # 不覆盖同名产物，方便一次运行出多个包（比如 tag 版本 + dev 版本）
          if-no-files-found: error
          retention-days: 30
          path: |
            .build-app/SanhaiMac-macos.zip
            SanhaiMac.dmg

      - name: 上传直链（仅 tag 构建）
        # 只有打 tag 才往 Releases 里放东西。这样 main 的日常构建不会污染发布记录。
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .build-app/SanhaiMac-macos.zip
            SanhaiMac.dmg
          # ⚠️ draft: true —— 草稿不会让别人看到，确认没问题再手动发布。
          #    这个包是**未签名**的，直接公开发布等于让每个下载的人
          #    都撞一次 Gatekeeper 的墙。草稿期间只给内部验证用。
          draft: true
          name: SanhaiMac ${{ github.ref_name }}（未签名内测版）
          # 正文的第一段必须先讲"怎么打开"，而不是讲这是什么 ——
          # 用户是从 Release 页面直接下载的，不会先去读 README。
          # 不先说清楚的话，第一次双击打不开就直接放弃了。
          body: |
            ## ⚠️ 这是**未签名**版本，首次打开需要手动放行

            苹果要求应用经过签名和公证才允许直接打开，本项目目前没有开发者账号，
            所以产出的 app 未经签名。macOS 的 Gatekeeper 会拦下它 —— **双击是打不开的**。

            **放行方法（任选一种）：**

            1. 在「访达」里**右键**点 `SanhaiMac.app` → 选「打开」→ 弹窗里再点「打开」
            2. 打开「系统设置 → 隐私与安全性」，往下翻到被阻止的提示，点「仍要打开」
            3. 选中 app 按 `⌘I`，在「隐私与安全性」一栏点「仍要打开」

            建议下载 **zip** 而不是 dmg：macOS 解压 zip 会自动去掉隔离属性，
            装起来更顺畅。把解压出来的 `SanhaiMac.app` 拖进「应用程序」即可。

            ---

            ### 这是什么

            SanhaiOJ（Hydro 内核，https://www.myijk.com）的 macOS 原生客户端。
            需要 macOS 13 或更高版本。当前只有两个页面：题库、评测。

            ### 首次使用

            1. 打开左侧「设置」
            2. 「站点」填站点根地址：填 `https://www.myijk.com` 这种根地址，**不要**带 `/client-api` 之类的路径
            3. 「令牌」填 Bearer 令牌；没有的话可以用同一页的「用账号密码换令牌」自动获取
            4. 点「测试」，看到「连接成功」再走
            5. 回到「题库」「评测」页，用工具栏的刷新按钮（`⌘R`）加载数据

            ### 已知问题

            * 令牌默认存进系统钥匙串。如果钥匙串不可用，可在设置页开启
              「允许明文文件保存（调试用）」——令牌等同于账号密码，
              请不要在长期使用的机器上长期开启该选项。
            * 图标是系统默认图标。
          generate_release_notes: true